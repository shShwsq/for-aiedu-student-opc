# SecondLook 一键部署编排
# 外部依赖(不在此编排内):
#   - 阿里云 RDS PostgreSQL:经 DATABASE_URL 直连
#   - OpenSandbox Server(另一台服务器):经 SANDBOX_SERVER_URL 直连
#
# 用法:cd deploy && bash deploy.sh(或 cp .env.production.example .env.production 后 docker compose up -d)
name: secondlook

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        # PyPI 镜像源,默认阿里云;主源某个包没同步全时自动挑备源重试
        # (.env.production 里写 PIP_INDEX_URL / PIP_INDEX_FALLBACK=...,或 compose build --build-arg)
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_INDEX_FALLBACK: ${PIP_INDEX_FALLBACK:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: secondlook-backend:latest
    env_file:
      - .env.production
    volumes:
      # 日志持久化(出题链路 practice_generate.log / perf.log / acp/)
      - backend_logs:/app/backend/logs
      # 统一数据根:任务交付物上传(Stage 1 永久真源,失败重试 / resume 复用)/
      # 用户上传 skill / 本地克隆 / 仓库缓存,单卷单备份策略;
      # 须与 UPLOADS_DIR 绝对路径一致。旧部署升级见 README「升级到统一数据根」
      - backend_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - appnet
    # 后端不对外暴露端口,全部经 nginx 反代
    # 如需直连排查可临时加:ports: ["8000:8000"]

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        # VITE_* 为构建期变量,由 deploy.sh source .env.production 后注入
        VITE_GITHUB_OAUTH_CLIENT_ID: ${VITE_GITHUB_OAUTH_CLIENT_ID:-}
        VITE_GITHUB_OAUTH_REDIRECT_URI: ${VITE_GITHUB_OAUTH_REDIRECT_URI:-}
        VITE_GITEE_OAUTH_CLIENT_ID: ${VITE_GITEE_OAUTH_CLIENT_ID:-}
        VITE_GITEE_OAUTH_REDIRECT_URI: ${VITE_GITEE_OAUTH_REDIRECT_URI:-}
    image: secondlook-frontend:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet

volumes:
  backend_logs:
  backend_data:

networks:
  appnet:
    driver: bridge
