[pytest]
; 只收集 tests/ 目录,避免误扫 _repos/ 克隆的临时仓库
; (其中的 app.py 会遮蔽 app 包导致 ImportError)
testpaths = tests

; 并行执行(pytest-xdist,需先装 requirements-dev.txt):
;   pytest -n 4    ; 本机 8 逻辑核,4 worker 是远端 PostgreSQL 压力与收益的平衡点
;   pytest -n auto ; 按核数启动,但重型 DB 用例集中时 4 反而更快,可按需试
; 选 loadscope 而非默认 load 的原因:
;   test_practice_api / _explain_api / _generate_stream 等用 session 级 fixture
;   在远端库建独立 schema(create_all 走 WAN 很贵)。默认 load 会把同模块用例
;   拆到不同 worker,导致每个 worker 重复建 schema,并行反而不比串行快;
;   loadscope 把同一文件(模块 scope)钉在一个 worker,schema 只建一次。
; 该选项仅在带 -n 时生效:不带 -n 仍是串行,调试单个用例不受影响、无额外开销。
addopts = --dist loadscope
